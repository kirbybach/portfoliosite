<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="#fffdf7" shape-rendering="crispEdges">
  <defs>
    <!-- Each unit of artwork is one logical pixel, displayed at exactly 2 CSS pixels. -->
    <pattern id="ledge" width="216" height="28" patternUnits="userSpaceOnUse">
      <path transform="scale(2)" d="M0 0h108v7H93V6H82v2H61v2H48V9H30V7H18V6H0Z M56 11h2v1h-2z"/>
    </pattern>
    <pattern id="side" width="20" height="112" patternUnits="userSpaceOnUse">
      <path transform="scale(2)" d="M0 0h6v12h2v9H6v8H5v12h2v9H6v6H0Z"/>
    </pattern>
    <g id="corner" transform="scale(2)">
      <path d="M0 0h40v4h-6v2h-5v2h-5v2h-4v2h-4v2h-3v3h-3v3H7v4H4v4H0Z"/>
      <path d="M23 12h2v1h-2z"/>
    </g>
    <!-- Only two lips split. Each seam is a few connected cells cut into the rim. -->
    <g id="notch" transform="scale(2)" fill="black">
      <path d="M23 12h-4v-1h-3V9h-2V8h-3V7H9V6H7V5h3v1h2v1h3v1h2v1h2v1h4z"/>
      <path d="M18 10V8h1V6h2V5h2v1h-1v1h-2v3z"/>
    </g>
    <mask id="cracks" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="white"/>
      <svg x="100%" overflow="visible"><use href="#notch" transform="scale(-1 1)"/></svg>
      <svg y="100%" overflow="visible"><use href="#notch" transform="scale(1 -1)"/></svg>
    </mask>
    <filter id="depth" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feOffset in="SourceAlpha" dy="2" result="lip"/>
      <feFlood flood-color="#bd8b60"/>
      <feComposite in2="lip" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g mask="url(#cracks)">
    <g filter="url(#depth)">
      <rect width="100%" height="28" fill="url(#ledge)"/>
      <rect width="20" height="100%" fill="url(#side)"/>
      <svg x="100%" y="100%" overflow="visible">
        <g transform="scale(-1 -1)">
          <rect width="100%" height="28" fill="url(#ledge)"/>
          <rect width="20" height="100%" fill="url(#side)"/>
        </g>
      </svg>
      <use href="#corner"/>
      <svg x="100%" overflow="visible"><use href="#corner" transform="scale(-1 1)"/></svg>
      <svg y="100%" overflow="visible"><use href="#corner" transform="scale(1 -1)"/></svg>
      <svg x="100%" y="100%" overflow="visible"><use href="#corner" transform="scale(-1 -1)"/></svg>
    </g>
  </g>
</svg>
